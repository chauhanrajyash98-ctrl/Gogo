<!DOCTYPE html>

<style>
/* VOICE: josh bhara desi 3D arcade
   IDEA: raat ke dangal ka 3D akhaada
   PICTURE: poora screen 3D akhaada, upar health bars
   COLOUR and TYPE: sunehra, aag jaisa laal, raat ka neela; bhaari mote akshar
   LAYOUT: 3D canvas poori screen, HUD upar, touch buttons neeche */
html,body{margin:0;height:100%;background:#07050f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;color:#fff;font-family:"Arial Black",Impact,system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.side{position:absolute;top:calc(12px + env(safe-area-inset-top));width:min(38vw,560px)}
.side.l{left:calc(16px + env(safe-area-inset-left))}.side.r{right:calc(16px + env(safe-area-inset-right))}
.bar{position:relative;height:clamp(14px,3.2vh,26px);background:rgba(10,5,20,.75);border:2px solid #fff;border-radius:8px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;width:100%}
.r .bar i{left:auto;right:0}
.bar .trail{background:#ff3b3b}
.bar .hp{background:linear-gradient(#fff27a,#ffb300);box-shadow:inset 0 3px 0 rgba(255,255,255,.4)}
.bar.low .hp{background:linear-gradient(#ff8a5c,#ff3b3b)}
.meter{margin-top:6px;height:8px;width:55%;background:rgba(10,5,20,.75);border-radius:5px;overflow:hidden}
.r .meter{margin-left:auto}
.meter i{display:block;height:100%;width:0;background:#ffd23f}
.r .meter i{margin-left:auto}
.meter.full i{background:#fff;animation:pulse .3s infinite alternate}
@keyframes pulse{to{background:#ffd23f}}
.name{margin-top:6px;font-size:clamp(14px,2.6vh,22px);text-shadow:0 2px 0 #120a1a,0 0 6px #120a1a}
.r .name{text-align:right}
.wins{display:flex;gap:6px;margin-top:4px}.r .wins{justify-content:flex-end}
.wins b{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid #120a1a}
.wins b.on{background:#ffd23f}
#timer{position:absolute;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translateX(-50%);width:clamp(48px,9vh,72px);height:clamp(48px,9vh,72px);border-radius:50%;background:rgba(10,5,20,.8);border:3px solid #ffd23f;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,4.4vh,36px)}
#combo{position:absolute;top:28vh;font-size:clamp(24px,6vh,48px);text-shadow:0 3px 0 #120a1a;opacity:0;transition:opacity .2s}
#banner{position:absolute;left:0;right:0;top:34vh;text-align:center;opacity:0}
#banner .t{font-size:clamp(40px,12vh,96px);color:#ffd23f;text-shadow:0 5px 0 #120a1a,0 0 20px rgba(0,0,0,.6);letter-spacing:1px}
#banner .s{font-size:clamp(16px,4vh,30px);text-shadow:0 3px 0 #120a1a}
#banner.show{animation:pop .5s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(2.2)}40%{opacity:1;transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
#screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,rgba(18,10,26,.35),rgba(18,10,26,.85));pointer-events:none;padding:20px}
#screen h1{margin:0;font-size:clamp(44px,13vh,110px);line-height:.95;color:#ffd23f;text-shadow:0 6px 0 #120a1a}
#screen h1 span{color:#ff5a3c;display:block}
#screen p{margin:10px 0 0;font-size:clamp(14px,2.8vh,22px);color:#d9f2ff;text-shadow:0 2px 0 #120a1a;max-width:900px;font-family:system-ui,sans-serif;font-weight:800}
#screen .go{margin-top:22px;font-size:clamp(20px,4.4vh,34px);color:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
#screen.hide{display:none}
#touch{display:none;position:fixed;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);right:env(safe-area-inset-right);pointer-events:none}
#touch div{position:absolute;pointer-events:auto;width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;color:#fff;font:900 14px system-ui,-apple-system,sans-serif}
#touch div.on{background:rgba(255,255,255,.4)}
#touch svg{width:42%;height:42%;fill:#fff}
#touch .atk{width:66px;height:66px}
#turn{display:none;position:fixed;inset:0;background:#120a1a;color:#fff;font:800 22px system-ui,sans-serif;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:5}
@media (orientation:portrait){body.touch #turn{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="side l"><div class="bar"><i class="trail"></i><i class="hp"></i></div><div class="meter"><i></i></div><div class="name"></div><div class="wins"><b></b><b></b></div></div>
  <div class="side r"><div class="bar"><i class="trail"></i><i class="hp"></i></div><div class="meter"><i></i></div><div class="name"></div><div class="wins"><b></b><b></b></div></div>
  <div id="timer">60</div>
  <div id="combo"></div>
  <div id="banner"><div class="t"></div><div class="s"></div></div>
</div>
<div id="screen"><h1>TOOFANI<span>TAKKAR 3D</span></h1><p id="msg">Taiyaar ho raha hai... <b id="pct">0%</b></p><div class="go" id="go"></div></div>
<div id="touch">
  <div data-k="l" style="left:10px;bottom:30px"><svg viewBox="0 0 10 10"><path d="M7 1L2 5l5 4z"/></svg></div>
  <div data-k="r" style="left:126px;bottom:30px"><svg viewBox="0 0 10 10"><path d="M3 1l5 4-5 4z"/></svg></div>
  <div data-k="u" style="left:68px;bottom:94px"><svg viewBox="0 0 10 10"><path d="M5 2l4 6H1z"/></svg></div>
  <div data-k="p" class="atk" style="right:154px;bottom:14px">MUKKA</div>
  <div data-k="k" class="atk" style="right:82px;bottom:76px">LAAT</div>
  <div data-k="s" class="atk" style="right:10px;bottom:14px;font-size:12px;border-color:#ffd23f">SPECIAL</div>
  <div data-k="pause" style="left:50%;top:70px;margin-left:-20px;width:40px;height:40px"><svg viewBox="0 0 10 10"><path d="M2 1h2v8H2zM6 1h2v8H6z"/></svg></div>
</div>
<div id="turn">Phone ko aada (landscape) karo<br>tabhi ladai achhi dikhegi</div>
<script type="module">
import * as THREE from './lib/three.module.min.js';
import {GLTFLoader} from './lib/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from './lib/addons/utils/SkeletonUtils.js';
import {MeshoptDecoder} from './lib/addons/libs/meshopt_decoder.module.js';

const $=s=>document.querySelector(s);
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(IS_TOUCH)document.body.classList.add('touch');
const rnd=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ================= Renderer, scene, camera ================= */
const renderer=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,IS_TOUCH?1.5:2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,16/9,0.1,300);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,300));resize();

/* ================= Sound ================= */
let ac=null,noiseBuf=null,master=null;
function initAudio(){if(ac){if(ac.state==='suspended')ac.resume();return;}try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0.7;master.connect(ac.destination);const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,n);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}catch(e){ac=null;}}
function osc(f1,f2,dur,type,vol,t0){t0=t0||ac.currentTime;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f1,t0);if(f2!==f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t0+dur);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.03);}
function nz(dur,ft,freq,vol,t0,f2){t0=t0||ac.currentTime;const s=ac.createBufferSource();s.buffer=noiseBuf;const fl=ac.createBiquadFilter();fl.type=ft;fl.frequency.setValueAtTime(freq,t0);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t0+dur);const g=ac.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);s.connect(fl);fl.connect(g);g.connect(master);s.start(t0,Math.random()*0.5);s.stop(t0+dur+0.03);}
const SFX={whoosh:()=>nz(0.14,'bandpass',500,0.22,0,2600),hitL:()=>{osc(220,60,0.12,'sine',0.6);nz(0.07,'highpass',1800,0.28);},hitH:()=>{osc(150,32,0.3,'sine',0.85);nz(0.2,'lowpass',1600,0.5);},
  block:()=>{osc(1300,900,0.05,'square',0.1);nz(0.06,'highpass',4000,0.25);},thud:()=>{osc(95,30,0.35,'sine',0.8);nz(0.25,'lowpass',500,0.5);},
  special:()=>{osc(160,950,0.5,'sawtooth',0.16);nz(0.45,'bandpass',400,0.3,0,5000);},boom:()=>{osc(70,24,1.0,'sine',0.95);nz(0.9,'lowpass',1000,0.6,0,90);},
  bell:()=>{osc(1320,1300,0.7,'triangle',0.3);osc(1320,1300,0.7,'triangle',0.3,ac.currentTime+0.22);},select:()=>osc(660,880,0.07,'square',0.1)};
function sfx(n){if(!ac)return;try{SFX[n]();}catch(e){}}
let nextBeat=0,beatI=0;const BASS=[55,55,73.4,65.4];
function music(){if(!ac||ac.state!=='running'||G.state==='title'||G.state==='pause'){nextBeat=0;return;}
  if(nextBeat<ac.currentTime)nextBeat=ac.currentTime+0.05;
  while(nextBeat<ac.currentTime+0.15){const st=beatI%16,t=nextBeat;
    if(st%4===0)osc(150,40,0.18,'sine',0.3,t);if(st===4||st===12)nz(0.12,'bandpass',1800,0.14,t);if(st%2===1)nz(0.03,'highpass',7000,0.05,t);
    if(st%4===2||st===7){const f=BASS[(beatI>>4)%4]*(st===7?1.5:1);osc(f,f,0.14,'triangle',0.15,t);}if(st===10||st===14)osc(330,170,0.08,'sine',0.11,t);
    nextBeat+=0.13;beatI++;}}

/* ================= Input ================= */
const keys={},pressed={},gp={};let gpPrev={};
const KEYMAP={37:'l',65:'l',39:'r',68:'r',38:'u',87:'u',32:'u',40:'d',83:'d',74:'p',90:'p',49:'p',13:'ok',75:'k',88:'k',50:'k',403:'k',76:'s',67:'s',51:'s',404:'s',405:'s',406:'s',80:'pause',27:'pause',10009:'pause',19:'pause',10252:'pause',8:'pause'};
addEventListener('keydown',e=>{initAudio();const a=KEYMAP[e.keyCode];if(!a)return;e.preventDefault();if(!keys[a])pressed[a]=true;keys[a]=true;});
addEventListener('keyup',e=>{const a=KEYMAP[e.keyCode];if(a){keys[a]=false;e.preventDefault();}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(G.state==='fight')G.state='pause';});
$('#c').addEventListener('pointerdown',()=>{initAudio();pressed.ok=true;});
$('#screen').addEventListener('pointerdown',()=>{initAudio();pressed.ok=true;});
if(IS_TOUCH){$('#touch').style.display='block';
  document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;
    const on=e=>{e.preventDefault();e.stopPropagation();initAudio();if(!keys[k])pressed[k]=true;keys[k]=true;b.classList.add('on');};
    const off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on');};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);});}
function pollGamepad(){const list=navigator.getGamepads?navigator.getGamepads():[];const s={};
  for(const g of list){if(!g)continue;const ax=g.axes[0]||0,ay=g.axes[1]||0,b=i=>g.buttons[i]&&g.buttons[i].pressed;
    if(ax<-0.4||b(14))s.l=1;if(ax>0.4||b(15))s.r=1;if(ay<-0.5||b(12))s.u=1;if(b(0)||b(2))s.p=1;if(b(1))s.k=1;if(b(3)||b(5))s.s=1;if(b(9))s.pause=1;}
  for(const k of ['l','r','u','p','k','s','pause']){if(s[k]&&!gpPrev[k])pressed[k]=true;gp[k]=!!s[k];}gpPrev=s;}
const held=a=>!!(keys[a]||gp[a]);
const anyConfirm=()=>pressed.ok||pressed.p||pressed.k||pressed.s;
const pend={p:0,k:0,s:0};let holdP=0;
const EMPTY={l:0,r:0,u:0,pP:0,pK:0,pS:0,hold:0};

/* ================= Arena ================= */
const THEMES=[
  {name:'Akhaada',sky:['#2d1b4e','#e0614d','#ffc178'],fog:0x6a3a52,sun:0xffc9a0,hemi:[0xffd0b0,0x3a1d2a],ground:'#8d5636',sil:'#3b1d40',rim:0xff7a3c,lamp:0xffa040},
  {name:'Chhat ki Ladai',sky:['#04071a','#1b2559','#3c4a8a'],fog:0x1a2040,sun:0x9fb8ff,hemi:[0x8fa8ff,0x10121f],ground:'#4f5460',sil:'#0b0f24',rim:0x4dd2ff,lamp:0xffc870},
  {name:'Mandir ka Aangan',sky:['#a8401e','#f07a3a','#ffe0a3'],fog:0x9a5a32,sun:0xffe2b0,hemi:[0xffe6c0,0x4a2a14],ground:'#b88a5c',sil:'#6b2c14',rim:0xffd060,lamp:0xffb040}
];
let arena=null;const lamps=[];
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;}
function buildArena(i){
  if(arena){scene.remove(arena);arena.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){[].concat(o.material).forEach(m=>{if(m.map)m.map.dispose();m.dispose();});}});}
  lamps.length=0;const T=THEMES[i];arena=new THREE.Group();scene.add(arena);
  scene.fog=new THREE.Fog(T.fog,18,70);scene.background=new THREE.Color(T.fog);
  const sky=canvasTex(2048,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,T.sky[0]);gr.addColorStop(0.6,T.sky[1]);gr.addColorStop(1,T.sky[2]);g.fillStyle=gr;g.fillRect(0,0,w,h);
    if(i===1){for(let k=0;k<300;k++){g.fillStyle='rgba(255,255,255,'+(0.3+rnd()*0.7)+')';g.fillRect(rnd()*w,rnd()*h*0.6,1.5,1.5);}g.fillStyle='#f4f1d0';g.beginPath();g.arc(w*0.3,110,40,0,7);g.fill();}
    else{g.fillStyle='rgba(255,236,180,.9)';g.beginPath();g.arc(w*0.25,h*0.62,70,0,7);g.fill();}
    g.fillStyle=T.sil;
    for(let k=0;k<70;k++){const x=k*w/70+rnd()*20;
      if(i===0){const r=30+rnd()*40;g.beginPath();g.arc(x,h-40,r,Math.PI,0);g.fill();}
      else if(i===1){const bw=26+rnd()*30,bh=60+rnd()*170;g.fillRect(x,h-bh,bw,bh);g.fillStyle='#ffd56b';for(let yy=h-bh+10;yy<h-10;yy+=14)for(let xx=x+4;xx<x+bw-6;xx+=10)if(rnd()<0.3)g.fillRect(xx,yy,5,7);g.fillStyle=T.sil;}
      else if(k%5===0){const hh=120+rnd()*90;g.beginPath();g.moveTo(x-30,h);g.quadraticCurveTo(x-26,h-hh*0.7,x,h-hh);g.quadraticCurveTo(x+26,h-hh*0.7,x+30,h);g.fill();g.fillRect(x-1,h-hh-26,2,26);}}
    g.fillRect(0,h-40,w,40);
    for(let x=0;x<w;x+=11){const hh=18+rnd()*14;g.fillStyle=rnd()<0.5?'#1a0c1f':'#26122c';g.beginPath();g.arc(x,h-hh-8,6,0,7);g.fill();g.fillRect(x-6,h-hh-4,12,hh+4);}});
  sky.wrapS=THREE.RepeatWrapping;sky.repeat.x=2;
  const dome=new THREE.Mesh(new THREE.CylinderGeometry(45,45,26,64,1,true),new THREE.MeshBasicMaterial({map:sky,side:THREE.BackSide,fog:false}));dome.position.y=12;arena.add(dome);
  const gtex=canvasTex(1024,1024,(g,w,h)=>{g.fillStyle=T.ground;g.fillRect(0,0,w,h);for(let k=0;k<5000;k++){g.fillStyle='rgba(0,0,0,'+rnd()*0.12+')';g.fillRect(rnd()*w,rnd()*h,2+rnd()*5,2+rnd()*3);}
    for(let k=0;k<1500;k++){g.fillStyle='rgba(255,255,255,'+rnd()*0.06+')';g.fillRect(rnd()*w,rnd()*h,2,2);}
    g.strokeStyle='rgba(255,230,180,.25)';g.lineWidth=10;g.beginPath();g.arc(w/2,h/2,w*0.36,0,7);g.stroke();
    if(i!==0){g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=3;for(let x=0;x<w;x+=64){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();g.beginPath();g.moveTo(0,x);g.lineTo(w,x);g.stroke();}}});
  gtex.wrapS=gtex.wrapT=THREE.RepeatWrapping;gtex.repeat.set(3,3);
  const ground=new THREE.Mesh(new THREE.CircleGeometry(45,64),new THREE.MeshStandardMaterial({map:gtex,roughness:0.95,metalness:0}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;arena.add(ground);
  const postM=new THREE.MeshStandardMaterial({color:0x5b3418,roughness:0.8}),capM=new THREE.MeshStandardMaterial({color:0xffd23f,metalness:0.6,roughness:0.3}),ropeM=new THREE.MeshStandardMaterial({color:0xc62828,roughness:0.6});
  const corners=[[-7.4,-2.6],[7.4,-2.6],[-7.4,2.6],[7.4,2.6]];
  for(const [x,z] of corners){const p=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.11,1.6,12),postM);p.position.set(x,0.8,z);p.castShadow=true;arena.add(p);const c=new THREE.Mesh(new THREE.SphereGeometry(0.13,12,8),capM);c.position.set(x,1.62,z);arena.add(c);}
  for(const h of [0.55,0.95,1.35]){for(const [a,b] of [[0,1],[0,2],[1,3]]){const A=new THREE.Vector3(corners[a][0],h,corners[a][1]),B=new THREE.Vector3(corners[b][0],h,corners[b][1]);const len=A.distanceTo(B);
      const r=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,len,6),ropeM);r.position.copy(A).add(B).multiplyScalar(0.5);r.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),B.clone().sub(A).normalize());arena.add(r);}}
  const lampM=new THREE.MeshBasicMaterial({color:T.lamp});
  for(const x of [-9,9]){const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,3.2,8),postM);pole.position.set(x,1.6,-3.6);arena.add(pole);
    const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.22,16,12),lampM);bulb.position.set(x,3.25,-3.6);arena.add(bulb);
    const L=new THREE.PointLight(T.lamp,8,14,1.6);L.position.set(x,3.0,-3.2);arena.add(L);lamps.push(L);}
  hemi.color.set(T.hemi[0]);hemi.groundColor.set(T.hemi[1]);sun.color.set(T.sun);rim.color.set(T.rim);
}
const hemi=new THREE.HemisphereLight(0xffffff,0x333333,1.1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(4,9,7);sun.castShadow=true;sun.shadow.mapSize.set(IS_TOUCH?1024:2048,IS_TOUCH?1024:2048);
Object.assign(sun.shadow.camera,{left:-6,right:6,top:5,bottom:-2,near:1,far:30});sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.02;scene.add(sun);scene.add(sun.target);

  if(G.A)G.A.dispose();if(G.B)G.B.dispose();
  const op=CHARS[G.opps[G.ladder]];G.A=new Fighter(CHARS[G.sel],-1.6,1,null);G.B=new Fighter(op,1.6,-1,LV[G.ladder]);for(const f of [G.A,G.B])if(f.act.roar)f.play('roar',{speed:2.2,fade:0.1});
  G.timer=60;G.state='intro';G.stateT=0;G.freeze=G.slow=G.superT=0;G.koFocus=null;G.camX=0;pend.p=pend.k=pend.s=0;
  banner('ROUND '+G.round,THEMES[G.ladder%3].name);
}
function startMatch(){G.wins=[0,0];G.round=1;buildArena(G.ladder%3);startRound();hideScreen();}
function pInput(){const I={l:held('l'),r:held('r'),u:held('u'),pP:pend.p,pK:pend.k,pS:pend.s,hold:holdP};pend.p=pend.k=pend.s=0;return I;}
function step(dt){
  G.t+=dt;music();updFx(dt);if(G.shake>0)G.shake=Math.max(0,G.shake-dt*0.6);
  if(pressed.p||pressed.ok)pend.p=1;if(pressed.k)pend.k=1;if(pressed.s)pend.s=1;holdP=(held('p')||held('ok'))?holdP+1:0;
  for(const L of lamps)L.intensity=7+Math.sin(G.t*13+L.position.x)*0.8+rnd()*0.6;
  switch(G.state){
    case 'title':if(anyConfirm()){sfx('bell');startSelect();}return;
    case 'select':updSelect(dt);return;
    case 'pause':if(pressed.pause||anyConfirm()){G.state='fight';hideScreen();}return;
    case 'lost':if(G.stateT++>30){if(anyConfirm())startMatch();else if(pressed.pause){startDemo();title();}}simWorld(dt,EMPTY,EMPTY);return;
    case 'champ':if(G.stateT++>60&&anyConfirm()){startDemo();title();}simWorld(dt,EMPTY,EMPTY);return;
  }
  if(G.state==='intro'){G.stateT+=dt;simWorld(dt,EMPTY,EMPTY);if(G.stateT>1.5&&G.stateT-dt<=1.5){banner('LADO!','','#ff5a3c');sfx('bell');}if(G.stateT>2.1)G.state='fight';return;}
  if(G.state==='fight'){
    if(pressed.pause){G.state='pause';screenMsg('RUKA HUA','',IS_TOUCH?'Tap karke aage khelo':'OK dabao aage khelne ke liye');return;}
    simWorld(dt,pInput(),aiInput(G.B,dt));
    if(G.freeze<=0&&G.superT<=0)G.timer-=dt;
    if(G.A.hp<=0||G.B.hp<=0){G.state='ko';G.stateT=0;G.slow=1.4;G.koFocus=G.A.hp<=0?G.A:G.B;banner('K.O.!','','#ff4d4d');sfx('boom');}
    else if(G.timer<=0){G.state='ko';G.stateT=0;banner('TIME UP!');sfx('bell');}
    return;}
  if(G.state==='ko'){G.stateT+=dt;simWorld(dt,EMPTY,EMPTY);
    if(G.stateT>2.6){const A=G.A,B=G.B;
      if(A.hp===B.hp){banner('BARABAR!','Round dobara');G.state='over';G.stateT=0;G.draw=true;return;}
      const w=A.hp>B.hp?A:B;w.winner=true;G.wins[w===A?0:1]++;G.draw=false;banner(w.name+' JEETA!',w.hp>=1000?'PERFECT!':'',w.tintCss);G.state='over';G.stateT=0;}
    return;}
  if(G.state==='over'){G.stateT+=dt;simWorld(dt,EMPTY,EMPTY);
    if(G.stateT>3.2){if(G.wins[0]>=2){G.ladder++;if(G.ladder>=3){G.state='champ';G.stateT=0;screenMsg('CHAMPION!',CHARS[G.sel].name+' ne teeno ko hara diya!',IS_TOUCH?'Tap karo':'OK dabao');sfx('bell');}else{startMatch();}}
      else if(G.wins[1]>=2){G.state='lost';G.stateT=0;screenMsg('HAAR GAYE!','Himmat mat haaro, dobara lado',IS_TOUCH?'Tap karo: dobara lado':'OK: dobara lado     BACK: menu');}
      else{if(!G.draw)G.round++;startRound();}}}
}
function simWorld(dt,iA,iB){
  if(G.superT>0){G.superT-=dt;return;}
  if(G.freeze>0){G.freeze-=dt;return;}
  let sdt=dt;if(G.slow>0){G.slow-=dt;sdt=dt*0.3;}
  const A=G.A,B=G.B;if(!A)return;
  updF(A,sdt,iA);updF(B,sdt,iB);
  const minD=0.72;if(Math.abs(B.x-A.x)<minD&&A.st!=='down'&&B.st!=='down'){const ov=(minD-Math.abs(B.x-A.x))/2*(B.x>=A.x?1:-1);A.x=clamp(A.x-ov,-ARENA,ARENA);B.x=clamp(B.x+ov,-ARENA,ARENA);}
  for(const f of [A,B]){f.mixer.update(sdt);f.place();
    const k=f.flash>0?1:0;for(const m of f.mats){if(m.emissive){m.emissive.setRGB(k*0.9,k*0.9,k*0.9);}}}
}
function updCam(dt){if(G.state==='select'){camera.position.set(0,1.5,8.6);camera.lookAt(0,1.05,0);sun.position.set(4,9,7);sun.target.position.set(0,0,0);return;}if(!G.A)return;const A=G.A,B=G.B;let tx=(A.x+B.x)/2,sep=Math.abs(A.x-B.x),td=clamp(3.6+sep*0.85,4.6,9.5);
  if(G.state==='ko'&&G.slow>0&&G.koFocus){tx=G.koFocus.x;td=3.6;}
  G.camX+=(tx-G.camX)*Math.min(1,dt*5);G.camD+=(td-G.camD)*Math.min(1,dt*3);
  const sx=(rnd()-0.5)*G.shake,sy=(rnd()-0.5)*G.shake;
  const ar=camera.aspect,dd=G.camD*(ar<1.5?1.25:1);
  camera.position.set(G.camX+sx+dd*0.08,1.45+sy+dd*0.06,dd);camera.lookAt(G.camX,1.0,0);
  sun.position.set(G.camX+4,9,7);sun.target.position.set(G.camX,0,0);}
function title(){$('#screen').style.background='';$('#screen').style.justifyContent='';screenMsg('TOOFANI<span>TAKKAR 3D</span>',IS_TOUCH?'Baayein: chalo aur kudo, peeche chalo = bachaav. MUKKA, LAAT, aur josh bharne par SPECIAL. Mukka-Mukka-Laat = combo!':'Teer se chalo / kudo, peeche = bachaav.  J ya OK = mukka,  K = laat,  L = special.<br>Mukka-Mukka-Laat = combo!  4 yoddhaon mein se apna chuno aur baaki teeno ko hara kar champion bano.',IS_TOUCH?'Screen par tap karo':'OK dabao shuru karne ke liye');G.state='title';}

/* ================= Load ================= */
const loader=new GLTFLoader();loader.setMeshoptDecoder(MeshoptDecoder);
const prog={};const showProg=()=>{const v=Object.values(prog);$('#pct').textContent=Math.round(v.reduce((a,b)=>a+b,0)/CHARS.length*100)+'%';};
Promise.all(CHARS.map(c=>new Promise((res,rej)=>loader.load(c.id+'.glb',g=>{prog[c.id]=1;showProg();res(g);},e=>{if(e.total){prog[c.id]=e.loaded/e.total;showProg();}},rej)))).then(gs=>{
  for(const c of gs[0].animations)CLIPS[c.name]=stripRoot(c);
  VAN_HY=hipsY(gs[0].scene);
  CHARS.forEach((c,i)=>{c.base=gs[i].scene;c.hy=hipsY(c.base);c.own=i>0?gs[i].animations:[];
    const hw=new THREE.Vector3();c.base.updateMatrixWorld(true);c.base.getObjectByName('mixamorigHips').getWorldPosition(hw);
    c.S=c.size*1.0/hw.y;c.clips=charClips(c);calibrate(c);});
  GETUP_FROM=Math.min(1.0,CLIPS.getup.duration*0.12);
  buildArena(0);startDemo();title();window.__G=G;window.__CHARS=CHARS;
}).catch(err=>{$('#msg').textContent='Load nahi ho paya: '+err;});
function startDemo(){if(G.A)G.A.dispose();if(G.B)G.B.dispose();const a=Math.floor(rnd()*4);let b;do{b=Math.floor(rnd()*4);}while(b===a);G.A=new Fighter(CHARS[a],-1.6,1,LV[1]);G.B=new Fighter(CHARS[b],1.6,-1,LV[1]);}
/* ---------- character select ---------- */
let PREV=[];
function startSelect(){if(G.A)G.A.dispose();if(G.B)G.B.dispose();G.A=G.B=null;PREV.forEach(p=>p.dispose());buildArena(0);
  PREV=CHARS.map((c,i)=>{const f=new Fighter(c,-3.3+i*2.2,1,null);f.root.rotation.y=0.25;return f;});G.sel=G.sel||0;G.state='select';G.selDone=0;selMsg();}
function selMsg(){const c=CHARS[G.sel];const bars=k=>'<b style="color:'+c.css+'">'+'&#9632;'.repeat(c.stats[k])+'</b>'+'<span style="opacity:.25">'+'&#9632;'.repeat(5-c.stats[k])+'</span>';
  screenMsg('<span style="color:'+c.css+';font-size:.6em">'+c.name+'</span>',c.desc+'<br>Tezi '+bars(0)+' &nbsp; Taakat '+bars(1)+' &nbsp; Dum '+bars(2),G.selDone?'TAIYAAR!':(IS_TOUCH?'Teer se chuno, MUKKA se pakka karo':'Baayein-daayein se chuno, OK dabao'));
  $('#screen').style.background='linear-gradient(transparent 55%,rgba(18,10,26,.85))';$('#screen').style.justifyContent='flex-end';}
function updSelect(dt){
  PREV.forEach((f,i)=>{f.mixer.update(dt);const sel=i===G.sel;f.root.rotation.y+=((sel?0.0:0.35)-f.root.rotation.y)*Math.min(1,dt*6);
    const sc=sel?1.12:0.92;f.root.scale.setScalar(f.root.scale.x+(sc-f.root.scale.x)*Math.min(1,dt*8));f.aura.intensity=sel?5:0;});
  if(!G.selDone){
    if(pressed.l||pressed.r){G.sel=(G.sel+(pressed.r?1:3))%4;sfx('select');selMsg();PREV.forEach((f,i)=>{if(i===G.sel){f.play('win',{loop:true,fade:0.2});}else if(f.curName!=='idle')f.play('idle',{loop:true,fade:0.3});});}
    else if(pressed.pause){PREV.forEach(p=>p.dispose());PREV=[];startDemo();title();}
    else if(anyConfirm()){G.selDone=0.001;sfx('bell');PREV[G.sel].play('win',{loop:true,fade:0.2});selMsg();}}
  else{G.selDone+=dt;if(G.selDone>1.4){PREV.forEach(p=>p.dispose());PREV=[];$('#screen').style.background='';$('#screen').style.justifyContent='';
    G.opps=[0,1,2,3].filter(i=>i!==G.sel);G.ladder=0;startMatch();}}
}
/* ================= Loop ================= */
let last=performance.now();
function frame(now){let dt=Math.min(0.05,(now-last)/1000);last=now;pollGamepad();
  if(G.state==='title'&&G.A){simWorld(dt,aiInput(G.A,dt),aiInput(G.B,dt));if(G.A.hp<=0||G.B.hp<=0){G.A.hp=G.B.hp=1000;}}
  step(dt);for(const k in pressed)pressed[k]=false;
  updCam(dt);updHud();renderer.render(scene,camera);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
