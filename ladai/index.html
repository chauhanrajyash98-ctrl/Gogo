html,body{margin:0;height:100%;background:#07050f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#touch{display:none;position:fixed;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);right:env(safe-area-inset-right);pointer-events:none}

@media (orientation:portrait){body.touch #turn{display:flex}}

<script>
{
/* ================= Screen ================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(IS_TOUCH)document.body.classList.add('touch');
const H=720;let W=1280;cv.height=H;
function fit(){const ar=innerWidth/Math.max(1,innerHeight);const nw=Math.round(Math.max(1280,Math.min(2000,H*ar)));if(nw!==W||cv.width!==nw){W=nw;cv.width=W;}const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));if(window.visualViewport)visualViewport.addEventListener('resize',fit);fit();
const GY=()=>IS_TOUCH?H*0.69:H*0.84;
const ARENA=2400,GRAV=0.75;
const rnd=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ================= Sound ================= */
let ac=null,noiseBuf=null,master=null;
function initAudio(){if(ac){if(ac.state==='suspended')ac.resume();return;}try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0.7;master.connect(ac.destination);const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,n);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}catch(e){ac=null;}}
function osc(f1,f2,dur,type,vol,t0){t0=t0||ac.currentTime;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f1,t0);if(f2!==f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t0+dur);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.03);}
function nz(dur,ft,freq,vol,t0,f2){t0=t0||ac.currentTime;const s=ac.createBufferSource();s.buffer=noiseBuf;const fl=ac.createBiquadFilter();fl.type=ft;fl.frequency.setValueAtTime(freq,t0);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t0+dur);const g=ac.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);s.connect(fl);fl.connect(g);g.connect(master);s.start(t0,Math.random()*0.5);s.stop(t0+dur+0.03);}
const SFX={
  whoosh:()=>nz(0.13,'bandpass',500,0.22,0,2600),
  hitL:()=>{osc(220,60,0.12,'sine',0.6);nz(0.07,'highpass',1800,0.28);},
  hitH:()=>{osc(150,32,0.3,'sine',0.85);nz(0.2,'lowpass',1600,0.5);},
  block:()=>{osc(1300,900,0.05,'square',0.1);nz(0.06,'highpass',4000,0.25);},
  jump:()=>nz(0.1,'bandpass',300,0.14,0,900),
  land:()=>nz(0.12,'lowpass',400,0.28),
  thud:()=>{osc(95,30,0.35,'sine',0.8);nz(0.25,'lowpass',500,0.5);},
  special:()=>{osc(160,950,0.5,'sawtooth',0.16);nz(0.45,'bandpass',400,0.3,0,5000);},
  boom:()=>{osc(70,24,1.0,'sine',0.95);nz(0.9,'lowpass',1000,0.6,0,90);},
  select:()=>osc(660,880,0.07,'square',0.1),
  confirm:()=>{osc(440,440,0.08,'square',0.12);osc(880,880,0.18,'square',0.12,ac.currentTime+0.08);},
  bell:()=>{osc(1320,1300,0.7,'triangle',0.3);osc(1320,1300,0.7,'triangle',0.3,ac.currentTime+0.22);}
};
function sfx(n){if(!ac)return;try{SFX[n]();}catch(e){}}
let nextBeat=0,beatI=0;const BASS=[55,55,73.4,65.4];
function music(){if(!ac||ac.state!=='running'||G.state==='title'||G.state==='pause'){nextBeat=0;return;}
  if(nextBeat<ac.currentTime)nextBeat=ac.currentTime+0.05;
  while(nextBeat<ac.currentTime+0.15){const st=beatI%16,t=nextBeat;
    if(st%4===0)osc(150,40,0.18,'sine',0.3,t);
    if(st===4||st===12)nz(0.12,'bandpass',1800,0.14,t);
    if(st%2===1)nz(0.03,'highpass',7000,0.05,t);
    if(st%4===2||st===7){const f=BASS[(beatI>>4)%4]*(st===7?1.5:1);osc(f,f,0.14,'triangle',0.15,t);}
    if(st===10||st===14)osc(330,170,0.08,'sine',0.11,t);
    nextBeat+=0.13;beatI++;}}

addEventListener('keydown',e=>{initAudio();const a=KEYMAP[e.keyCode];if(!a)return;e.preventDefault();if(!keys[a])pressed[a]=true;keys[a]=true;});
addEventListener('keyup',e=>{const a=KEYMAP[e.keyCode];if(a){keys[a]=false;e.preventDefault();}});

    const off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on');};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);});}
function pollGamepad(){const list=navigator.getGamepads?navigator.getGamepads():[];const s={};
  for(const g of list){if(!g)continue;const ax=g.axes[0]||0,ay=g.axes[1]||0,b=i=>g.buttons[i]&&g.buttons[i].pressed;
    if(ax<-0.4||b(14))s.l=1;if(ax>0.4||b(15))s.r=1;if(ay<-0.5||b(12))s.u=1;if(ay>0.5||b(13))s.d=1;
    if(b(0)||b(2))s.p=1;if(b(1))s.k=1;if(b(3)||b(5))s.s=1;if(b(9))s.pause=1;}
  for(const k of ['l','r','u','d','p','k','s','pause']){if(s[k]&&!gpPrev[k])pressed[k]=true;gp[k]=!!s[k];}gpPrev=s;}

const SPEC={

/* ---------- animation ---------- */
function mk(seq,from,loop){let total=0;for(const s of seq)total+=s[1];return{seq,t:0,from,loop,total,last:PS[seq[seq.length-1][0]]};}
function play(f,seq){f.loop=null;f.anim=mk(seq,f.pose,false);}

function animPose(a){

function computeJ(f){

  const hip=[0,0],neck=[Math.sin(p.t)*tor*d,-Math.cos(p.t)*tor];
  const head=add(neck,[Math.sin(p.t+p.hd)*(hr+5)*d,-Math.cos(p.t+p.hd)*(hr+5)]);
  const shp=[neck[0]*0.9,neck[1]*0.9],at=p.t*0.4;
  const eF=add(shp,v(p.aF+at,up)),hF=add(eF,v(p.aF+at+p.eF,fo));
  const eB=add(shp,v(p.aB+at,up)),hB=add(eB,v(p.aB+at+p.eB,fo));
  const kF=add(hip,v(p.hF,th)),fF=add(kF,v(p.hF-p.kF,sh));

  const phi=-d*(p.rot||0),cs=Math.cos(phi),sn=Math.sin(phi);
  for(const k in J){const q=J[k];const x=q[0]*cs-q[1]*sn,y=q[0]*sn+q[1]*cs;q[0]=x;q[1]=y;}
  const maxY=Math.max(J.fF[1]+3,J.fB[1]+3,J.toeF[1],J.toeB[1],J.kF[1]+9*s,J.kB[1]+9*s,J.hip[1]+16*s,J.neck[1]+14*s,J.head[1]+hr,J.hF[1]+8,J.hB[1]+8);

function tailAnchor(f){const J=f.J,hr=J.hr,d=f.face,lx=-hr*0.85*d,ly=-hr*0.35,cs=Math.cos(J.phi),sn=Math.sin(J.phi);return[J.head[0]+lx*cs-ly*sn,J.head[1]+lx*sn+ly*cs];}

function updTail(f){const tl=f.tail;if(!tl.length)return;const a=tailAnchor(f),seg=(f.ch.style==='pony'?11:13)*f.ch.scale;tl[0].x=a[0];tl[0].y=a[1];
  for(let i=1;i<tl.length;i++){const p=tl[i];const vx=(p.x-p.px)*0.88,vy=(p.y-p.py)*0.88;p.px=p.x;p.py=p.y;p.x+=vx-f.face*0.4;p.y+=vy+0.5;}
  for(let it=0;it<2;it++)for(let i=1;i<tl.length;i++){const p=tl[i],q=tl[i-1];const dx=p.x-q.x,dy=p.y-q.y,l=Math.hypot(dx,dy)||1,k=(l-seg)/l;p.x-=dx*k;p.y-=dy*k;}}

function newF(ci,x,face,lvl){const f={ch:CH[ci],ci,x,h:0,vx:0,vh:0,face,hp:1000,hpShow:1000,meter:0,st:'stand',pose:P({}),anim:null,loop:null,atk:null,stun:0,timer:0,juggle:0,combo:0,comboT:0,flash:0,dRec:99,hRec:99,hDir:0,trail:[],ghosts:[],tail:[],landed:false,isWinner:false,rotOv:null,ai:lvl?{lvl,think:30,blockT:0,pend:null,hold:null}:null};

/* ---------- fighter logic ---------- */
function toStand(f){f.st='stand';f.atk=null;f.loop=null;f.rotOv=null;f.trail=[];f.buf=null;}
function land(f){f.h=0;f.vh=0;dust(f.x,0,5,false);sfx('land');}
function startAtk(f,name){const a=ATK[name];f.st='atk';f.atk=a;f.hitDone=false;f.buf=null;f.trail=[];play(f,a.seq);f.justAtk=true;if(!a.air)f.vx=f.face*1.5;f.face=f.atk.air?f.face:(G.other(f).x>f.x?1:-1);}
function startSpecial(f){f.meter=0;f.sbuf=0;f.st='atk';f.atk=Object.assign({},SPEC[f.ch.special],{special:true});f.hitDone=false;f.sp={t:0,cd:0,hits:0,ph:0};f.trail=[];f.face=G.other(f).x>f.x?1:-1;f.atk.start(f);f.justAtk=true;
  G.superT=28;G.superF=f;sfx('special');addText(f.ch.sname+'!',f.x,-300*f.ch.scale,f.ch.aura,50);}
function updF(f,o,inp){
  f.justAtk=false;if(f.flash>0)f.flash--;if(f.comboT>0)f.comboT--;
  f.dRec=inp.d?0:f.dRec+1;if(inp.l||inp.r){f.hDir=inp.r?1:-1;f.hRec=0;}else f.hRec++;
  const fwd=f.face>0?inp.r:inp.l,back=f.face>0?inp.l:inp.r;
  f.guard=!!back;f.crouch=!!inp.d;
  f.landed=false;
  if(f.h>0||f.vh>0){f.vh-=GRAV;f.h+=f.vh;if(f.h<=0){f.h=0;f.landed=true;}}
  f.x+=f.vx;
  if(inp.pS||inp.hold===20)f.sbuf=14;else if(f.sbuf>0)f.sbuf--;
  const wantSpecial=f.sbuf>0&&f.meter>=100;
  switch(f.st){
    case 'stand':{
      if(f.isWinner){f.vx*=0.7;setLoop(f,'win');break;}
      f.face=o.x>f.x?1:-1;
      if(wantSpecial){startSpecial(f);break;}
      const low=inp.d||f.dRec<10;
      if(inp.pP){startAtk(f,low?'up':'jab');break;}
      if(inp.pK){startAtk(f,low?'sweep':'kick');break;}
      if(inp.u){const dir=(inp.l||inp.r)?(inp.r?1:-1):(f.hRec<8?f.hDir:0);f.st='jump';f.airAtk=false;f.vh=15;f.h=0.1;f.vx=dir*Math.max(3.5,f.ch.speed*1.2);play(f,[['jump',6],['jump',60]]);sfx('jump');dust(f.x,0,4,false);break;}
      if(f.crouch){f.vx*=0.6;setLoop(f,f.guard?'cblock':'crouch');}
      else if(fwd){f.vx=f.face*f.ch.speed;setLoop(f,'walk');}
      else if(back){f.vx=-f.face*f.ch.speed*0.72;setLoop(f,'walkb');}
      else{f.vx*=0.6;setLoop(f,'idle');}
      break;}
    case 'jump':
      if(!f.airAtk&&(inp.pK||inp.pP)){f.airAtk=true;startAtk(f,'jkick');break;}
      if(f.landed){land(f);toStand(f);}
      break;

      const t=f.anim.t;

      if(t>=a.act[1]&&f.buf&&a.chain&&a.chain[f.buf]){startAtk(f,a.chain[f.buf]);break;}

        else{f.h=0;f.vh=0;f.st=f.hp<=0?'ko':'down';f.timer=36;play(f,[['down',8]]);dust(f.x,0,6,true);}}
      break;
    case 'down':f.vx*=0.8;if(--f.timer<=0){f.st='getup';play(f,[['getup1',12],['idle',12]]);}break;
    case 'getup':f.vx=0;if(f.anim.t>=f.anim.total){f.juggle=0;toStand(f);}break;

function invuln(d){return d.st==='down'||d.st==='getup'||d.st==='ko'||(d.st==='fall'&&d.juggle>=3);}
function hurtBox(f){const J=f.J;let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const k of ['hip','neck','head','eF','hF','eB','hB','kF','fF','kB','fB']){const q=J[k];if(q[0]<x0)x0=q[0];if(q[0]>x1)x1=q[0];if(q[1]<y0)y0=q[1];if(q[1]>y1)y1=q[1];}return{x0:x0-10,x1:x1+10,y0:y0-J.hr,y1:y1+6};}

/* ---------- computer opponent ---------- */
const LV=[{react:20,block:0.25,think:24,combo:0.25,spec:0.3},{react:14,block:0.45,think:17,combo:0.5,spec:0.5},{react:9,block:0.62,think:12,combo:0.7,spec:0.7}];
function aiInput(f,o){
  const I={l:0,r:0,u:0,d:0,pP:0,pK:0,pS:0,hold:0},ai=f.ai,L=ai.lvl;
  const F=f.face>0?'r':'l',Bk=f.face>0?'l':'r',dist=Math.abs(o.x-f.x);
  if(o.justAtk&&dist<420&&!ai.pend)ai.pend={t:L.react,low:!!(o.atk&&o.atk.low)};
  for(const p of G.proj)if(p.owner===o&&!ai.pend&&Math.abs(p.x-f.x)<320&&Math.sign(f.x-p.x)===Math.sign(p.vx))ai.pend={t:L.react,low:p.k==='wave'};
  if(ai.pend&&--ai.pend.t<=0){if(rnd()<L.block){ai.blockT=24;ai.blockLow=ai.pend.low;}ai.pend=null;}
  if(ai.blockT>0&&(f.st==='stand'||f.st==='block')){ai.blockT--;I[Bk]=1;I.d=ai.blockLow?1:0;return I;}
  if(f.st==='atk'&&f.atk&&f.atk.chain&&!ai.chained&&f.anim.t>=f.atk.act[0]){ai.chained=true;if(rnd()<L.combo&&!o.guard){if(f.atk.chain.p&&rnd()<0.55)I.pP=1;else if(f.atk.chain.k)I.pK=1;else I.pP=1;}return I;}
  if(f.st!=='atk')ai.chained=false;
  if(f.st==='jump'){if(dist<200&&rnd()<0.2)I.pK=1;return I;}
  if(f.st!=='stand')return I;
  if(--ai.think>0){if(ai.hold)I[ai.hold==='f'?F:Bk]=1;if(ai.crouch)I.d=1;return I;}
  ai.think=L.think+Math.floor(rnd()*10);ai.hold=null;ai.crouch=false;
  if(o.st==='down'||o.st==='getup'||o.st==='ko'||o.st==='fall'){if(dist>220)ai.hold='f';return I;}
  if(f.meter>=100&&rnd()<L.spec){const sp=f.ch.special;const ok=sp==='ball'?dist>240:sp==='charge'?dist<560:sp==='slam'?dist<500:dist<320;if(ok){I.pS=1;return I;}}
  const r=rnd();
  if(dist>330){if(r<0.65)ai.hold='f';else if(r<0.8){I.u=1;I[F]=1;}}
  else if(dist>165){if(r<0.5){ai.hold='f';ai.think=6;}else if(r<0.63){I.u=1;I[F]=1;}else if(r<0.72)I.pK=1;else if(r<0.85)ai.hold='b';}
  else{if(r<0.32)I.pP=1;else if(r<0.48){I.d=1;I.pK=1;}else if(r<0.6){I.d=1;I.pP=1;}else if(r<0.76)I.pK=1;else if(r<0.9)ai.hold='b';else{I.u=1;I[Bk]=1;}}
  return I;
}

function startDemo(){G.demo=true;G.demoA=Math.floor(rnd()*4);do{G.demoB=Math.floor(rnd()*4);}while(G.demoB===G.demoA);G.arena=Math.floor(rnd()*3);G.wins=[0,0];G.round=1;startRound();}
function startMatch(){G.wins=[0,0];G.round=1;G.arena=G.ladder%3;startRound();}
function pauseGame(){if(G.state==='fight'){G.prevState='fight';G.state='pause';}}
function simStep(iA,iB){
  updFx();
  if(G.superT>0){G.superT--;return;}
  if(G.freeze>0){G.freeze--;return;}
  if(G.slow>0){G.slow--;if(G.slow%3!==0)return;}
  const A=G.P,B=G.C;
  updF(A,B,iA);updF(B,A,iB);
  computeJ(A);computeJ(B);updTail(A);updTail(B);
  resolveHits(A,B);resolveHits(B,A);
  for(const f of [A,B]){if(f.st==='atk'&&f.atk&&f.atk.limb){f.trail.push(f.J[f.atk.limb].slice());if(f.trail.length>7)f.trail.shift();}else if(f.trail.length)f.trail.shift();}
  for(const p of G.proj){p.x+=p.vx;p.t++;const tgt=G.other(p.owner);
    if(p.k==='wave'&&p.t%2===0)dust(p.x,0,1,true);
    if(p.k==='ball')G.fx.push({k:'orb',x:p.x,y:p.y+(rnd()-0.5)*20,vx:-p.vx*0.1,vy:(rnd()-0.5),t:0,life:16,col:p.owner.ch.aura});
    if(!invuln(tgt)&&circRect(p.x,p.y,p.r,hurtBox(tgt))){applyHit(p.owner,tgt,p.data,[p.x,p.y]);p.dead=true;}
    if(p.t>p.life||p.x<-100||p.x>ARENA+100)p.dead=true;}
  G.proj=G.proj.filter(p=>!p.dead);
  if(A.h<90&&B.h<90){const minD=34*(A.ch.scale+B.ch.scale),dx=B.x-A.x;if(Math.abs(dx)<minD){const ov=(minD-Math.abs(dx))/2*(dx>=0?1:-1);A.x=clamp(A.x-ov,50,ARENA-50);B.x=clamp(B.x+ov,50,ARENA-50);}}
}
function updCam(){const A=G.P,B=G.C;if(!A)return;let tx=(A.x+B.x)/2,tz=clamp(W/(Math.abs(A.x-B.x)+760),0.78,1.25);
  if(G.state==='ko'&&G.slow>0){const L=A.hp<=0?A:B;tx=L.x;tz=1.35;}
  G.cam.z+=(tz-G.cam.z)*0.06;G.cam.x+=(tx-G.cam.x)*0.1;const half=W/2/G.cam.z;G.cam.x=clamp(G.cam.x,half-200,ARENA-half+200);}
function pInput(){const I={l:held('l'),r:held('r'),u:held('u'),d:held('d'),pP:pend.p,pK:pend.k,pS:pend.s,hold:holdP};pend.p=pend.k=pend.s=false;return I;}

function update(){
  G.t++;music();G.shake*=0.85;G.cheer*=0.985;
  if(pressed.p||pressed.ok)pend.p=true;if(pressed.k)pend.k=true;if(pressed.s)pend.s=true;
  holdP=(held('p')||held('ok'))?holdP+1:0;
  const st=G.state;
  if(G.demo&&st!=='title'&&st!=='select'&&['intro','fight','ko','roundOver'].includes(st)&&confirmPressed()){G.demo=false;G.state='select';G.stateT=0;G.confirmed=false;sfx('confirm');return;}
  switch(st){
    case 'title':break;
    case 'select':{G.stateT++;
      for(const f of PV){f.face=1;f.anim.t++;f.pose=animPose(f.anim);computeJ(f);updTail(f);}
      if(!G.confirmed){
        if(pressed.l){G.sel=(G.sel+3)%4;sfx('select');}if(pressed.r){G.sel=(G.sel+1)%4;sfx('select');}
        if(pressed.pause){startDemo();G.state='intro';break;}
        if(confirmPressed()&&G.stateT>10){G.confirmed=true;G.stateT=0;setLoop(PV[G.sel],'win');sfx('confirm');}
      }else if(G.stateT>50){G.opps=[0,1,2,3].filter(i=>i!==G.sel);G.ladder=0;G.state='vs';G.stateT=0;setLoop(PV[G.sel],'idle');}
      break;}
    case 'vs':G.stateT++;for(const f of PV){f.anim.t++;f.pose=animPose(f.anim);}if(G.stateT===1)sfx('boom');if(G.stateT>150||(G.stateT>40&&confirmPressed()))startMatch();break;
    case 'intro':
      G.stateT++;simStep(EMPTY,EMPTY);updCam();
      if(G.stateT===2&&!G.demo){banner('ROUND '+G.round,'#ffd23f',ARENAS[G.arena]);}
      if(G.stateT===70){if(!G.demo){banner('LADO!','#ff5a3c');sfx('bell');}}
      if(G.stateT>100)G.state='fight';
      break;
    case 'fight':{
      if(pressed.pause&&!G.demo){pauseGame();sfx('select');break;}
      const iA=G.demo?aiInput(G.P,G.C):pInput(),iB=aiInput(G.C,G.P);
      simStep(iA,iB);updCam();
      if(G.freeze<=0&&G.superT<=0)G.timer--;
      if(G.P.hp<=0||G.C.hp<=0){G.state='ko';G.stateT=0;G.slow=90;if(!G.demo)banner('K.O.!','#ff4d4d');sfx('boom');G.cheer=1;}
      else if(G.timer<=0){G.state='ko';G.stateT=0;if(!G.demo)banner('TIME UP!','#ffd23f');sfx('bell');}
      break;}
    case 'ko':
      G.stateT++;simStep(EMPTY,EMPTY);updCam();
      if(G.stateT>140){const A=G.P,B=G.C;
        if(A.hp===B.hp){if(!G.demo)banner('BARABAR!','#ffffff','Round dobara');G.state='roundOver';G.stateT=0;G.draw=true;break;}
        const w=A.hp>B.hp?A:B;w.isWinner=true;G.wins[w===A?0:1]++;G.draw=false;
        if(!G.demo)banner(w.ch.name+' JEETA!',w.ch.aura,w.hp>=1000?'PERFECT!':null);
        G.state='roundOver';G.stateT=0;}
      break;
    case 'roundOver':
      G.stateT++;simStep(EMPTY,EMPTY);updCam();
      if(G.stateT>170){
        if(G.wins[0]>=2||G.wins[1]>=2){
          if(G.demo){startDemo();break;}
          if(G.wins[0]>=2){G.ladder++;if(G.ladder>=3){G.state='champion';G.stateT=0;G.conf=[];setLoop(PV[G.sel],'win');sfx('bell');}else{G.state='vs';G.stateT=0;}}
          else{G.state='lost';G.stateT=0;}
        }else{if(!G.draw)G.round++;startRound();}}
      break;
    case 'pause':if(pressed.pause||confirmPressed()){G.state='fight';sfx('select');}break;
    case 'lost':G.stateT++;updFx();
      if(G.stateT>40){if(confirmPressed()){startMatch();}else if(pressed.pause){startDemo();}}break;
    case 'champion':{G.stateT++;const f=PV[G.sel];f.face=1;f.anim.t++;f.pose=animPose(f.anim);computeJ(f);updTail(f);
      if(G.stateT%2===0)G.conf.push({x:rnd()*W,y:-20,vx:(rnd()-0.5)*3,vy:2+rnd()*3,r:rnd()*6,c:['#ffd23f','#ff5a3c','#7cff6b','#4dd2ff','#ff8fd0'][Math.floor(rnd()*5)]});
      for(const c of G.conf){c.x+=c.vx;c.y+=c.vy;c.r+=0.1;}G.conf=G.conf.filter(c=>c.y<H+20);
      if(G.stateT>60&&confirmPressed()){startDemo();G.state='intro';}break;}
  }
  if(st==='title'||(G.demo&&G.state!=='select')){if(confirmPressed()&&G.state!=='select'){G.demo=false;G.state='select';G.stateT=0;G.confirmed=false;sfx('confirm');}}
}

function txt(s,x,y,size,col,align,lw){ctx.font='900 '+size+'px "Arial Black",Impact,system-ui,sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='alphabetic';ctx.lineJoin='round';ctx.lineWidth=lw!==undefined?lw:Math.max(4,size*0.16);if(ctx.lineWidth>0){ctx.strokeStyle='#120a1a';ctx.strokeText(s,x,y);}ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);}

    for(let pass=0;pass<2;pass++)for(let i=1;i<tl.length;i++){const w=w0*(1-i/(tl.length+1));seg([tl[i-1].x,tl[i-1].y],[tl[i].x,tl[i].y],pass?w:w+5,pass?C(col):OL);}}

  seg(J.hip,J.neck,c.torsoW*s+6,OL);seg(J.hip,J.neck,c.torsoW*s,C(c.top||c.skin));
  const tx=J.neck[0]-J.hip[0],ty=J.neck[1]-J.hip[1],tlen=Math.hypot(tx,ty)||1,ux=tx/tlen,uy=ty/tlen,nx=-uy,ny=ux;
  if(!WH){
    if(!c.top){ctx.strokeStyle=shade(c.skin,0.7);ctx.lineWidth=3;const m=[J.hip[0]+tx*0.62,J.hip[1]+ty*0.62];

    else{seg([J.neck[0]+nx*c.torsoW*s*0.3,J.neck[1]+ny*c.torsoW*s*0.3],[J.hip[0]+tx*0.45,J.hip[1]+ty*0.45],3,shade(c.top,0.7));}
  }

  if(c.style==='pony'||c.style==='mask'){const k=[bc[0]-d*bw*0.3,bc[1]];seg(k,[k[0]-d*10*s-ux*4,k[1]+22*s],5*s+4,OL);seg(k,[k[0]-d*10*s-ux*4,k[1]+22*s],5*s,C(c.belt));}
  limb(J.hip,J.kF,J.fF,20*s,17*s,C(c.pants),C(c.pants));seg(J.fF,J.toeF,15*s,OL);seg(J.fF,J.toeF,9*s,C(c.shoe));

  const hr=J.hr;ctx.save();ctx.translate(J.head[0],J.head[1]);ctx.rotate(J.phi);ctx.scale(d,1);ctx.rotate((f.pose.hd+f.pose.t)*0.35);
  ctx.fillStyle=OL;ctx.beginPath();ctx.arc(0,0,hr+3,0,7);ctx.fill();

      seg([ex-7*s,ey-8*s],[ex+7*s,ey-5*s],3.5*s,c.style==='mask'?'#111':c.hair);}

  }
  ctx.restore();
  limb(J.sh,J.eF,J.hF,15*s,13*s,C(c.sleeve),C(c.fore));dot(J.hF,9.5*s,C(c.glove));

function drawTrail(f){const tr=f.trail;if(tr.length<2)return;ctx.lineCap='round';
  for(let i=1;i<tr.length;i++){const k=i/tr.length;ctx.globalAlpha=k*0.6;seg(tr[i-1],tr[i],k*24*f.ch.scale,i===tr.length-1?'#ffffff':f.ch.aura);}ctx.globalAlpha=1;}
function drawGhost(g){ctx.globalAlpha=g.life/14*0.35;ctx.lineCap='round';const J=g.J,w=16*g.s;
  for(const [a,b] of [['hip','neck'],['sh','eF'],['eF','hF'],['sh','eB'],['eB','hB'],['hip','kF'],['kF','fF'],['hip','kB'],['kB','fB'],['neck','head']])seg(J[a],J[b],w,g.col);

function drawFx(){

function L(p){return -(G.cam.x-ARENA/2)*p*G.cam.z;}
function drawArena(i){
  const gy=GY(),hz=gy-60*G.cam.z;
